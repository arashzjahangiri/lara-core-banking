# Local stack: PostgreSQL, the ledger service, Kafka and Debezium.
#
#   docker compose up --build
#
# The service is reachable on http://localhost:8080 with demo accounts already seeded, and every
# posting is published to the `ledger.account` Kafka topic within a second or two.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    # Logical decoding is what lets Debezium read the write-ahead log. Without it the connector
    # starts and then fails with a message that does not obviously point here.
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    ports:
      - "5432:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      # The service must not start migrating before the database can answer, otherwise the first
      # boot is a race that usually works and occasionally does not.
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  ledger:
    build:
      context: .
      dockerfile: services/ledger/bootstrap/src/main/docker/Dockerfile.jvm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/ledger
      QUARKUS_DATASOURCE_USERNAME: ledger
      QUARKUS_DATASOURCE_PASSWORD: ledger
    ports:
      # Overridable, because 8080 is the most contended port on any developer's machine:
      #   LEDGER_PORT=8081 docker compose up
      - "${LEDGER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Demo customer accounts, so a clean clone has something to post against.
  #
  # Seeded here rather than baked into the image. quarkus.flyway.locations is a build-time
  # property, so db/demo is packaged only under the dev and test profiles — a production build
  # carries db/migration alone and demo data cannot reach a real deployment. Runs after the ledger
  # is healthy, because the ledger is what creates the tables.
  demo-seed:
    image: postgres:17-alpine
    depends_on:
      ledger:
        condition: service_healthy
    environment:
      PGPASSWORD: ledger
    volumes:
      - ./compose/demo-accounts.sql:/seed/demo-accounts.sql:ro
    command: psql -h postgres -U ledger -d ledger -v ON_ERROR_STOP=1 -f /seed/demo-accounts.sql
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    environment:
      # Single-node KRaft. No ZooKeeper, which has not been required since Kafka 3.3.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    image: quay.io/debezium/connect:3.0
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ledger-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # The offsets topic is how the connector resumes exactly where it left off after a restart,
      # together with the replication slot on the Postgres side.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Registers the outbox connector once Connect is up. Idempotent: PUT on /config replaces an
  # existing connector rather than failing, so `docker compose up` twice is safe.
  connector-setup:
    image: curlimages/curl:8.11.1
    depends_on:
      connect:
        condition: service_healthy
      ledger:
        condition: service_healthy
    volumes:
      - ./compose/outbox-connector.json:/config/outbox-connector.json:ro
    command: >
      -sS -X PUT
      -H "Content-Type: application/json"
      --data @/config/outbox-connector.json
      --fail-with-body
      http://connect:8083/connectors/ledger-outbox/config
    restart: on-failure

volumes:
  ledger-data:
