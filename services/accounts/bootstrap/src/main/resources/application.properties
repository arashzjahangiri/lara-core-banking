# Accounts service
quarkus.application.name=accounts

# Its own database. Sharing a schema with the ledger would make this a distributed monolith:
# the two services could no longer be deployed, migrated or scaled independently.
quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.hibernate-orm.schema-management.strategy=validate

# A different port, so both services run side by side locally.
quarkus.http.port=8090
%test.quarkus.http.test-port=0

quarkus.smallrye-health.root-path=/health
