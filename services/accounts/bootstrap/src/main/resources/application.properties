# Accounts service
quarkus.application.name=accounts

# Its own database. Sharing a schema with the ledger would make this a distributed monolith:
# the two services could no longer be deployed, migrated or scaled independently.
quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.hibernate-orm.schema-management.strategy=validate

# A different port, so both services run side by side locally.
quarkus.http.port=8090
%test.quarkus.http.test-port=0

quarkus.smallrye-health.root-path=/health

# Consuming ledger postings.
#
# Keyed by account, so one account's movements share a partition and arrive in order. Delivery is
# at-least-once — Debezium republishes after a restart — so the consumer deduplicates on the
# transaction id rather than assuming each event arrives once.
mp.messaging.incoming.ledger-postings.connector=smallrye-kafka
mp.messaging.incoming.ledger-postings.topic=ledger.account
mp.messaging.incoming.ledger-postings.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.ledger-postings.auto.offset.reset=earliest
mp.messaging.incoming.ledger-postings.group.id=accounts-balance-projection

# An unreadable event goes to a dead-letter topic rather than blocking the partition forever or
# being dropped. Someone has to look at it; neither of the alternatives lets them.
mp.messaging.incoming.ledger-postings.failure-strategy=dead-letter-queue
mp.messaging.incoming.ledger-postings.dead-letter-queue.topic=ledger.account.dlq

# Tests call the consumer directly rather than through a broker, so Dev Services need not start
# Kafka on every run. The messaging plumbing is verified against the compose stack instead.
%test.mp.messaging.incoming.ledger-postings.enabled=false
