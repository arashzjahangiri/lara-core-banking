# Ledger service
quarkus.application.name=ledger

# Datasource
# No URL is configured on purpose. In dev and test, Quarkus Dev Services starts a real PostgreSQL
# in a container and wires it up; in production the URL arrives from the environment. A hardcoded
# localhost URL here would work on one machine and quietly break everywhere else.
quarkus.datasource.db-kind=postgresql

# Flyway owns the schema.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# Hibernate never creates or alters a table. Flyway is the single source of truth for the schema,
# and `validate` makes a drift between the entities and the migrations fail at startup rather than
# surfacing as a strange error under load.
quarkus.hibernate-orm.schema-management.strategy=validate

# Demo customer accounts, in dev and test only. Production runs db/migration alone, so this data
# cannot reach a real deployment — which is why it is a separate location rather than a flag inside
# a real migration.
%dev.quarkus.flyway.locations=db/migration,db/demo
%test.quarkus.flyway.locations=db/migration,db/demo

# Health
quarkus.smallrye-health.root-path=/health
