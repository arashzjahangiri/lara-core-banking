# Payments service: the transfer orchestrator.
quarkus.application.name=payments

# Its own database. The saga's state is this service's private business, and sharing a schema
# with the ledger would let a bug here corrupt the record of what money actually moved.
quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# validate, never update. Flyway owns the schema; letting Hibernate alter it would mean two
# things changing the same tables with no record of which did what.
quarkus.hibernate-orm.schema-management.strategy=validate

# A third port, so all the services run side by side locally.
quarkus.http.port=8100
%test.quarkus.http.test-port=0

quarkus.smallrye-health.root-path=/health

# Where the orchestrator's three outbound calls go. Overridden per environment; the defaults are
# the ports the services use when run side by side on one machine.
quarkus.rest-client.accounts-api.url=http://localhost:8090
quarkus.rest-client.risk-api.url=http://localhost:8110
quarkus.rest-client.ledger-api.url=http://localhost:8080

# Timeouts, set explicitly on every client. A missing one is the failure that takes a whole
# service down: threads pile up waiting on a dependency that is never going to answer.
quarkus.rest-client.accounts-api.connect-timeout=2000
quarkus.rest-client.accounts-api.read-timeout=5000
quarkus.rest-client.risk-api.connect-timeout=2000
quarkus.rest-client.risk-api.read-timeout=5000
quarkus.rest-client.ledger-api.connect-timeout=2000
quarkus.rest-client.ledger-api.read-timeout=10000

# The bank's own accounts, which must exist in the ledger's chart of accounts.
payments.sepa-suspense-account=BANK.SEPA.SUSPENSE.EUR
payments.fee-income-account=BANK.INCOME.FEES.EUR
# Idempotency keys.
#
# Retention is how long a client can still replay a request and get its original answer. A day is
# generous for an HTTP retry and short enough that the table stays small.
payments.idempotency.retention=PT24H
payments.idempotency.prune-interval=15m
payments.idempotency.prune-batch-size=500

# Tests drive the pruner directly rather than waiting for a scheduler, which would make them
# either slow or flaky.
%test.quarkus.scheduler.enabled=false
# Recovery.
#
# stall-timeout is how long a saga may sit in one state before the sweep treats it as stalled.
# Too short and it races healthy sagas mid-step; too long and a crashed transfer waits.
payments.recovery.interval=30s
payments.recovery.stall-timeout=PT2M
payments.recovery.batch-size=50
payments.recovery.max-attempts=5
# Resilience.
#
# The annotations carry the defaults; these make the policy configuration rather than code, so a
# budget can be changed for one environment without a release.
#
# Retry is only safe because every one of these calls is idempotent: the posting reference is
# derived from the transfer id, screening replays its stored decision, and the account lookup is
# a read. Jitter is not decoration — without it every payment that failed during a blip retries
# at the same instant, and the dependency coming back up is met by the whole backlog at once.
io.lara.payments.infrastructure.client.RestRiskScreening/screen/Retry/maxRetries=3
io.lara.payments.infrastructure.client.RestRiskScreening/screen/Retry/delay=200
io.lara.payments.infrastructure.client.RestRiskScreening/screen/Retry/jitter=150

io.lara.payments.infrastructure.client.RestAccountDirectory/find/Retry/maxRetries=3
io.lara.payments.infrastructure.client.RestLedgerPosting/post/Retry/maxRetries=3

# Breakers. Once a dependency is clearly down, failing immediately beats a thousand threads each
# spending a second of backoff on something that is not going to answer.
io.lara.payments.infrastructure.client.RestRiskScreening/screen/CircuitBreaker/delay=10000
io.lara.payments.infrastructure.client.RestAccountDirectory/find/CircuitBreaker/delay=10000
io.lara.payments.infrastructure.client.RestLedgerPosting/post/CircuitBreaker/delay=10000

# Off in tests. A breaker that trips partway through a suite makes later tests fail for reasons
# that have nothing to do with what they assert, and the retry delays alone add minutes.
%test.quarkus.fault-tolerance.enabled=false
# In tests the three dependencies are not running, and the tests rely on that. Pointing them at a
# port nothing can bind makes "unreachable" deterministic: left on the real ports, a service the
# developer happens to have running on 8080 answers 404 and the adapter correctly reads it as a
# refusal rather than an outage — so the test would assert the opposite of what it means to.
%test.quarkus.rest-client.accounts-api.url=http://localhost:1
%test.quarkus.rest-client.risk-api.url=http://localhost:1
%test.quarkus.rest-client.ledger-api.url=http://localhost:1