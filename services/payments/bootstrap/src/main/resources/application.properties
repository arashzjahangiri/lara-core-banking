# Payments service: the transfer orchestrator.
quarkus.application.name=payments

# Its own database. The saga's state is this service's private business, and sharing a schema
# with the ledger would let a bug here corrupt the record of what money actually moved.
quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# validate, never update. Flyway owns the schema; letting Hibernate alter it would mean two
# things changing the same tables with no record of which did what.
quarkus.hibernate-orm.schema-management.strategy=validate

# A third port, so all the services run side by side locally.
quarkus.http.port=8100
%test.quarkus.http.test-port=0

quarkus.smallrye-health.root-path=/health
