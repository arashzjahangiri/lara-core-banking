# Risk service: screening.
quarkus.application.name=risk

# Its own database. Limits and sanctions data is this service's to own, and a shared schema
# would let another service change the rules that this one is accountable for applying.
quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# validate, never update. The schema is Flyway's to own; letting Hibernate alter it would mean
# two things changing the same tables with no record of which did what.
quarkus.hibernate-orm.schema-management.strategy=validate

# A fourth port, so all the services run side by side locally.
quarkus.http.port=8110
%test.quarkus.http.test-port=0

quarkus.smallrye-health.root-path=/health